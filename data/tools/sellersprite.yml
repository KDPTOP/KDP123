name: SellerSprite
url: https://sellersprite.ai
categories: [keywords-categories, book-research]
tagline: SellerSprite is a subscription research suite for Amazon FBA and FBM sellers covering keywords, categories, competitors and BSR-based sales estimates.
summary: >-
  SellerSprite is built for physical-product sellers: product research, category insights, ASIN traffic analysis, review mining and sourcing-oriented filters. A KDP publisher can use its keyword research, reverse-ASIN traffic data and up to three years of BSR and sales history on competing listings, but it has no book-specific features and its sales estimates are generic BSR models. Its English site moved to sellersprite.ai; the older sellersprite.com pages still load and point there.
pricing: { model: freemium, from: 39, currency: USD, period: month, free_tier: true, note: "Basic is $39/month or $390/year. Sign-up needs no card and the Chrome extension is free to install; most data needs a paid plan. Refunds only for the unused part of a subscription.", annual_from: 32.5, trial_days: 3, region_note: Plan prices on the official pricing page are labeled in USD. }
platforms: [web, chrome-extension]
kdp:
