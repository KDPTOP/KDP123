pros:
  - Lower entry price than most Amazon seller suites
  - Shows up to three years of BSR and sales history for a listing
cons:
  - Nothing is designed for books; categories, filters and profit tools assume physical products
  - Product Tracker is not included on the Basic plan
best_for:
  - Amazon sellers researching products, keywords, and competitors with SellerSprite tools
