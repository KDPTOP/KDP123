name: Vellum
url: https://vellum.pub
categories: [writing-formatting]
tagline: Vellum is a Mac-only book formatter known for polished ebook and print output, sold for a one-time price.
summary: >-
  Vellum formats manuscripts into ebook and print-ready files and is widely treated as the benchmark for fiction formatting. It only runs on Mac. Two one-time licenses are sold: Vellum Ebooks for unlimited ebooks and Vellum Press for unlimited ebooks plus paperbacks and hardcovers, with 24 trim sizes and PDF/X-1a print output.
