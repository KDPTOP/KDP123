name: Book Design Templates
url: https://www.bookdesigntemplates.com
categories: [writing-formatting]
tagline: Book Design Templates sells pre-designed book interior templates for Word, Pages, InDesign and Affinity Publisher, sized to standard print-on-demand trims.
summary: >-
  Each template is a styled file at a standard trim size with chapter openers, running heads and front matter set up; you
  paste in your text, apply styles, and export the print PDF and EPUB from your own software. The store says the sizes
  are compliant with KDP and other POD printers, but the output is only as good as your export: Word users need Calibre
  or KDP's own DOCX conversion for the ebook. Licenses are per book, and the same team runs a separate AI-based
  done-for-you service, BookDesigner.ai.
