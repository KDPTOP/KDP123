name: The Book Designer
url: https://www.thebookdesigner.com
categories: [courses-blogs]
tagline: The Book Designer is a free blog for self-publishers about book design, interior layout, fonts and production, founded by Joel Friedlander.
summary: >-
  The Book Designer was started by book designer Joel Friedlander in 2009 and was bought by selfpublishing.com at the
  end of 2020, shortly before his death. It keeps an archive of his articles plus newer guides on trim sizes, margins,
  fonts and covers that apply to KDP print books. It is now owned by Chandler Bolt's selfpublishing.com (Self-Publishing
  School) and promotes that company's training and programs, so it is no longer an independent voice.
