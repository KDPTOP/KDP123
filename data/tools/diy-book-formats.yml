name: DIY Book Formats
url: https://diybookformats.com
categories: [writing-formatting]
tagline: DIY Book Formats is a site by author Derek Murphy that gives away 6x9 Word and InDesign interior templates and sells a larger premium template pack.
summary: >-
  The free pack has five Word and InDesign templates at 6x9 with styles, margins and page numbers set, plus video
  tutorials; you add your text and export the print PDF yourself, and the site links a free converter for the EPUB. It
  is not software, and the site itself recommends a formatter like Vellum for ebooks. The free templates are a lead-in to
  an email list and paid courses at Creativindie, and the Vellum links on the page are affiliate links.
