name: Grammarly
url: https://www.grammarly.com
categories: [editing]
tagline: Grammarly is a grammar, spelling and style checker that works in browsers, desktop apps and phones, with a free tier and a paid Pro plan.
summary: >-
  Grammarly flags spelling, grammar, clarity and tone issues as you write and can rewrite sentences, check for accidental plagiarism and generate text from prompts. It is built for general and business writing rather than fiction, is not a replacement for a human editor on a book manuscript, and is now part of Superhuman's software suite. Corrections and rewrites of your own text count as AI-assisted under KDP rules and need no disclosure, but text generated from prompts counts as AI-generated and must be disclosed.
