tagline: Indie Author Magazine is a trade publication for independent authors covering publishing news, marketing, tools and author business profiles.
summary: >-
  Indie Author Magazine is published by Chelle Honiker and covers weekly publishing news, KDP and Kindle+ (formerly Kindle Unlimited) changes, marketing and author business profiles, with a free tier and paid subscriptions for full access and print. The same publisher runs Indie Author Training, a paid course marketplace, and the site carries advertorial and partner content, so some coverage is commercial. It reports and profiles rather than teaching step-by-step KDP setup.
