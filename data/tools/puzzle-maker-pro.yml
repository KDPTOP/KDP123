name: Puzzle Maker Pro
url: https://www.bookpublishertools.com/puzzle-maker-pro/
categories: [low-content]
tagline: Puzzle Maker Pro is Windows software for puzzle book publishers that batch-generates 60+ puzzle types and assembles print-ready PDF interiors.
summary: >-
  Puzzle Maker Pro, sold by BookPublisherTools, generates word searches, sudoku variants, mazes, crossword variants and
  other logic puzzles with solutions, then builds a book interior with your trim size, margins and titles as PDF or
  PowerPoint. Every edition includes a commercial license to sell the finished books on KDP, Etsy and Teachers Pay
  Teachers; the right to sell or supply the generated puzzles themselves to other publishers needs the Productivity
  edition or the yearly Everything Unlimited plan. It runs on Windows only. The puzzlemakerpro.com site is a free
  puzzle showcase that links back to BookPublisherTools.
pricing: { model: paid, from: 47, currency: USD, period: one-time, note: "Single puzzle modules from $47 one-time (higher editions up to $177); all modules $97/month or $970/year. Free demo available." }
