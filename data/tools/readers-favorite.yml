name: Readers' Favorite
url: https://readersfavorite.com
categories: [reviews-arc]
tagline: Readers' Favorite is a book review and award contest site for authors that offers free reviews and paid express reviews by volunteer reviewers.
summary: >-
  Readers' Favorite reviewers pick books from its submission list; free reviews are not guaranteed (it says about 65% are
  picked within three months), while paid Express reviews guarantee a turnaround. Reviews appear on its own site and
  partner sites as editorial-style reviews, not as Amazon customer reviews, and only reviews of 4 stars or more are posted
  publicly, so its seals and ratings are not a neutral sample. It also runs a paid award contest. Do not post a paid
  review as an Amazon customer review: Amazon prohibits reviews in exchange for compensation.
pricing:
  model: freemium
  from: 59
  currency: USD
  period: one-time
  free_tier: true
  note: "Free review (not guaranteed). Express: $59 for one review in 2 weeks, $129 for three, $199 for five; packages add a mini-critique and Featured Book advertising."
platforms: [web]
kdp:
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [fiction, nonfiction, children]
pros:
  - Free review option with no fee
  - Accepts manuscripts and ARCs as well as published books
cons:
  - Reviews under 4 stars are not published on its site
  - Paid reviews do not count as Amazon customer reviews
best_for: [A quotable editorial review or seal for the book page and marketing]
alternatives: [netgalley, booksirens, booksprout]
status: published
verified_at: 2026-11-09
sources:
  - https://readersfavorite.com/book-reviews.htm
  - https://www.amazon.com/gp/help/customer/display.html?nodeId=GLHXEX85MENUE4XF
  - https://kdp.amazon.com/en_US/help/topic/G202101910
