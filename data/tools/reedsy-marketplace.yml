name: Reedsy Marketplace
url: https://reedsy.com
categories: [editing, cover-design]
tagline: Reedsy Marketplace is a curated freelance marketplace for authors that connects them with vetted editors, cover designers, marketers and translators.
summary: >-
  On the Reedsy Marketplace you browse profiles, send a brief to up to five professionals, and compare custom quotes for editing, cover and interior design, marketing, ghostwriting or translation; payments and files go through Reedsy. Reedsy says it accepts about 1% of freelancer applications, but quality and price still vary by professional. It is run by the same company as the free Reedsy Studio writing app and the Reedsy blog.
pricing: { model: paid, currency: USD, note: "No list prices; professionals quote per project. Reedsy adds a 10% client fee (and takes 10% from the professional)." }
platforms: [web]
kdp:
  touches_kdp_account: false
  content_types: [fiction, nonfiction, children]
pros:
  - Vetted professionals, many with traditional publishing experience
  - Payments, contracts and messages handled on the platform
cons:
  - Quote-based, typically pricier than open marketplaces
  - Only five quote requests per brief at a time
best_for:
  - Authors hiring handpicked editors, book designers, or marketers
alternatives: [fiverr, 99designs, damonza]
status: published
verified_at: 2026-11-09
