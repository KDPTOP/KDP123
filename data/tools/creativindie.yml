tagline: Creativindie is Derek Murphy's free blog for indie authors on writing, cover design, formatting and book marketing, alongside his paid courses and templates.
summary: >-
  Creativindie is run by Derek Murphy, an author and cover designer. It has free guides on KDP printing costs, cover
  design, formatting and book marketing, plus free tools such as a 3D mockup maker. He sells his own courses, cover
  templates and design and editing services on the site, and its footer says it uses Amazon Associate and other
  affiliate links, so "best tool" posts are not neutral. Many recent posts are general literature explainers rather
  than publishing advice.
