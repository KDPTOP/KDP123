name: Hidden Gems Books
url: https://www.hiddengemsbooks.com
categories: [reviews-arc, ads-promotion]
tagline: Hidden Gems Books is an ARC service for authors that sends review copies to genre-matched volunteer readers and bills per reader who signs up.
summary: >-
  Hidden Gems schedules an ARC date, shows your book's details to readers in its genre lists, and sends the book to those who reserve a copy; it reports an average review rate above 80% but guarantees neither the number of reviews nor the rating, and says such guarantees would break Amazon's rules. Amazon allows free copies as long as a review is not required and not influenced. Popular genres book up months ahead, and it also sells free and $0.99 newsletter promos.
pricing:
  model: paid
  from: 20
  currency: USD
  period: one-time
  note: "A $20 non-refundable deposit holds the date and covers the first 1-10 readers; additional readers are $3 each, up to a $400 MAX. You are billed only for readers who actually sign up (minimum order 50)."
platforms: [web]
kdp:
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [fiction, nonfiction]
pros:
  - Billed only for readers who actually reserve the book
  - States plainly that it guarantees no review counts or ratings
cons:
  - Deposit is non-refundable, and dates fill months in advance
  - Per-reader cost adds up for large orders
best_for:
  - Authors sending ARCs through Hidden Gems or booking publishing consultations
alternatives: [booksprout, booksirens, netgalley, storyorigin]
status: published
verified_at: 2026-11-09
sources:
  - https://www.hiddengemsbooks.com/arc-faq/
  - https://www.hiddengemsbooks.com/arc-program/
  - https://kdp.amazon.com/en_US/help/topic/G202101910
features_checked_at: 2026-11-10
