name: ProWritingAid
url: https://prowritingaid.com
categories: [editing]
tagline: ProWritingAid is a grammar and style editor aimed at fiction and long-form writers that runs line-editing reports on whole manuscripts.
summary: >-
  ProWritingAid checks grammar and style, runs reports on pacing, overused words and dialogue, and sells AI manuscript critiques through Story Credits; it works inside Word, Scrivener, Google Docs and browsers. The free tier checks only 500 words at a time, so a full book needs a paid plan, and it does not format books for KDP. Fixing your own prose with it is AI-assisted under KDP rules and needs no disclosure, but any text it generates for you counts as AI-generated and must be disclosed.
