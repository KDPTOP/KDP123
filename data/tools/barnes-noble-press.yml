name: Barnes & Noble Press
url: https://press.barnesandnoble.com
categories: [print-distribution]
tagline: Barnes & Noble Press is a free self-publishing service for authors that sells ebooks and print-on-demand books directly on bn.com.
summary: >-
  B&N Press publishes ebooks and paperback or hardcover print books for sale on Barnes & Noble's site, with no fee and no
  exclusivity. Ebooks earn 70% of list price; print books earn 55% of list price minus the printing cost, and since April
  2026 print books must list at $14.99 or more. Ebook list prices may not be higher than elsewhere. Selling the same ebook
  here conflicts with KDP Select; a print edition does not.
pricing: { model: free, currency: USD, note: "Free to publish. Ebooks 70% of list price. Print 55% of list price minus print cost, minimum list price $14.99. Paid once $25 is accrued." }
platforms: [web]
kdp:
  touches_kdp_account: false
  content_types: [any]
pros:
  - Print and ebook from one free account
  - Higher print royalty on bn.com than going through a distributor, per B&N's own comparison
cons:
  - Print books must list at $14.99 or more
  - Ebook price must not exceed its price at any other retailer
best_for: [Reaching Barnes & Noble shoppers directly with ebook and print]
alternatives: [kobo-writing-life, ingramspark, draft2digital]
