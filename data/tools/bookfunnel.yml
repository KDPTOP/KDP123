name: BookFunnel
url: https://bookfunnel.com
categories: [email-tools, reviews-arc, direct-sales]
tagline: BookFunnel is an ebook and audiobook delivery service for authors that sends reader magnets, review copies and direct-sale files to readers.
summary: >-
  BookFunnel hosts your ebook (and optionally audiobook) files and delivers them to readers through download and giveaway
  pages, group promos, mailing-list integrations, ARC delivery and direct-sales fulfillment. It is not an email service
  provider; it connects to one. BookFunnel's own knowledge base advises against giving away even a sample of a KDP Select
  book and suggests a separate reader magnet instead; sales promos that link to Amazon are fine.
pricing: { model: subscription, from: 30, currency: USD, period: year, refund_days: 30, note: "First-Time Author plan $30/year (500 downloads/month, no email collection or mailing-list integration). Mid-List $20/month or $200/year. Audiobook delivery is an add-on." }
platforms: [web]
kdp:
