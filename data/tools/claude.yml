name: Claude
url: https://claude.com
categories: [ai-tools]
tagline: Claude is Anthropic's general-purpose AI assistant that publishers use for brainstorming, outlining, drafting, editing feedback and book descriptions.
summary: >-
  Claude is a chat assistant on web, desktop and mobile that can discuss and revise long manuscripts, draft blurbs and ad copy, and create files. It is not built for books: it has no KDP formatting, trim or cover tools, so final files need a formatter. KDP requires you to disclose AI-generated text, images or translations when publishing, even if you edited them heavily; using Claude only to edit, error-check or brainstorm your own writing counts as AI-assisted and does not need disclosure.
