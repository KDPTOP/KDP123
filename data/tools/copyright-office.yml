tagline: The U.S. Copyright Office is the government registry where authors register copyrights and look up existing registrations.
summary: >-
  The U.S. Copyright Office handles copyright registration in the United States and publishes guidance on what can be
  registered, including questions about AI-generated material. Registration is optional for copyright to exist but can
  matter if you ever need to enforce your rights. Fees are set by the Office; check its current fee schedule.
