    note: "Plans listed as Free, Creator $19.99/mo ($199/yr), Pro $39/mo ($390/yr), Team $99/mo ($990/yr); first period 50% off after a 7-day trial."
platforms: [web, chrome-extension]
kdp:
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [any]
pros:
  - Daily Top 100 lists across about 11,000 categories, with history
  - One-card verdict per category with the inputs shown, not a black-box score
  - REST API and MCP server on every plan, including Free
  - Author pages with release histories
cons:
  - Sales are estimated from BSR and do not include Kindle+ page reads
  - Free plan opens only one full category a day
  - History for many categories is still building, so churn metrics fill in over time
best_for: [Deciding whether a category is worth writing for before you start a book, Tracking new books breaking into categories you follow]
