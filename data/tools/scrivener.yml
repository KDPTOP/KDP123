name: Scrivener
url: https://www.literatureandlatte.com/scrivener/overview
categories: [writing-formatting]
tagline: Scrivener is a desktop writing app for long manuscripts that organizes drafts and research and compiles them to EPUB, PDF and Word.
summary: >-
  Scrivener splits a manuscript into scenes and chapters you can rearrange, keeps research beside the draft, and uses a
  Compile step to export EPUB ebooks and PDFs at a custom page size for print. A KDP publisher can produce upload-ready
  files with it, but Compile settings take time to learn and many authors still move the text to a dedicated formatter
  for polished print interiors. Mac and Windows licenses are sold separately, and the iOS app is a separate App Store purchase.
pricing: { model: one-time, from: 59.99, currency: USD, period: one-time, refund_days: 30, note: "Price is per platform (macOS or Windows); a Mac + Windows bundle is $95.98 and the iOS app is $23.99. Free trial lasts 30 days of actual use." }
platforms: [mac, windows, ios]
kdp:
  outputs_kdp_files: true
  touches_kdp_account: false
  content_types: [fiction, nonfiction]
pros:
  - One-time license with a trial that counts only days of actual use
  - Compiles the same project to EPUB, PDF and Word with different formatting for each
cons:
  - Compile is complex; print layout is less polished than Vellum or Atticus
  - Separate licenses needed for Mac, Windows and iOS
best_for: [Drafting and organizing long or research-heavy books]
alternatives: [atticus, vellum, dabble, novelcrafter]
