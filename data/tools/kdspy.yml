name: KDSPY
url: https://www.kdspy.com
categories: [book-research, keywords-categories]
tagline: KDSPY is a paid browser extension that shows category, keyword, competitor and revenue estimates directly on Amazon pages.
summary: >-
  KDSPY works inside the browser while you browse Amazon: category breakdowns with estimated revenue and daily sales needed to rank, keyword analysis, author and publisher analysis, and 30-day book tracking. It is sold as a one-time purchase with a 60-day refund window. Its sales and revenue figures are estimates. It is not affiliated with Amazon.
