name: Shopify
url: https://www.shopify.com
categories: [direct-sales]
tagline: Shopify is a general ecommerce platform for small businesses that authors can use to run their own store and sell books directly to readers.
summary: >-
  Shopify hosts an online store with checkout, payments and email campaigns. It is a generic store builder, not a book
  tool: it does not print books or deliver ebook files itself, so authors pair it with apps such as Lulu Direct or
  Bookvault for print fulfillment. Selling an ebook from your own store conflicts with KDP Select if that ebook is
  enrolled.
pricing: { model: subscription, from: 39, currency: USD, period: month, free_tier: false, note: "Basic $39/month or $29/month billed yearly, plus card fees from 2.9% + 30¢. Offer shown: 3-day trial, then $1/month for 3 months." }
