tagline: The Self Publishing Show is a free weekly podcast for indie authors about marketing, ads, AI and the business of self-publishing.
summary: >-
  The Self Publishing Show is produced by The Self Publishing Formula Ltd and, since its February 2026 relaunch after an
  18-month break, is hosted by James Blatch and Cecelia Mecca rather than Mark Dawson. Episodes cover Amazon and Meta
  ads, KDP changes, launches and AI tools, often with guest authors. It promotes the hosts' paid courses on Learn
  Self Publishing and the paid Self Publishing Show Live events, and episodes carry sponsor discount codes.
