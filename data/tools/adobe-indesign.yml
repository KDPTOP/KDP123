  touches_kdp_account: false
  content_types: [any]
pros:
  - Full control of typography, bleed and image placement
  - Exports both print PDF (PDF/X presets) and EPUB
cons:
  - Subscription only, with an early-cancellation fee on annual plans
  - Steep learning curve for a single book
best_for: [Illustrated, image-heavy or design-led interiors]
