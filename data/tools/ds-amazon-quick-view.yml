name: DS Amazon Quick View
url: https://chromewebstore.google.com/detail/ds-amazon-quick-view/jkompbllimaoekaogchhkmkdogpkhojg
categories: [book-research, analytics]
tagline: DS Amazon Quick View is a free Chrome extension that shows Best Sellers Rank and ASIN on Amazon.com search results, with a paid Extended version.
summary: >-
  DS Amazon Quick View adds Best Sellers Rank, ASIN and seller information to Amazon search and bestseller pages. The free version works only on amazon.com. The Extended version, a one-time $25, supports all Amazon domains and adds filtering and sorting, CSV export, price history, and publisher and page count for books. It is a quick sanity check, not a full research suite: it shows no sales or demand estimates.
