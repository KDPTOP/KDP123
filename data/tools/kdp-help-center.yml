name: KDP Help Center
url: https://kdp.amazon.com/en_US/help
categories: [official]
tagline: The KDP Help Center is Amazon's official documentation for KDP publishers that sets out the rules on formatting, pricing, royalties, content and account setup.
summary: >-
  The KDP Help Center is where Amazon publishes its own rules and how-to pages for KDP: manuscript and cover
  requirements, pricing and royalty bands, categories and keywords, KDP Select, taxes and identity verification. Its home
  page also carries current announcements, such as Kindle Unlimited being renamed Kindle+ and the 70% eBook royalty band
  widening to $2.99 to $12.99 on Amazon.com. Topic URLs move often, so search from the home page rather than relying on old
  links, and treat third-party summaries as secondary to it.
official: true
