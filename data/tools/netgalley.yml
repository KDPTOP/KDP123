name: NetGalley
url: https://www.netgalley.com
categories: [reviews-arc]
tagline: NetGalley is a digital review copy platform for publishers and authors that offers advance copies to librarians, booksellers, media and reviewers.
summary: >-
  NetGalley lists your digital review copy for its professional members to request; you approve readers and see feedback
  and reports. A direct per-title listing is aimed at self-published authors and small presses, while resellers and author
  co-ops offer shorter, cheaper listings but control the listing and support. Reviews may land on NetGalley, Goodreads or
  Amazon, and none are guaranteed. Under Amazon's rules a free copy is fine only if a review is not required or steered.
pricing:
  model: paid
  from: 575
  currency: USD
  period: one-time
  note: "Direct listing is $575 per title for six months; a 12-month publisher subscription starts at about $6,000/year. Reseller and co-op prices vary."
platforms: [web]
kdp:
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [fiction, nonfiction, children]
pros:
  - Reaches librarians, booksellers and media, not only consumer reviewers
  - You approve or decline each request
cons:
  - Expensive for a single self-published title
  - Many downloads never turn into reviews
best_for: [Trade-facing launches that need librarian and bookseller attention]
alternatives: [booksprout, booksirens, hidden-gems-books, goodreads]
status: published
verified_at: 2026-11-09
sources:
  - https://netgalleyclient.zendesk.com/hc/en-us/articles/19260193294103-How-NetGalley-Works-with-Resellers
  - https://www.netgalley.com/
  - https://kdp.amazon.com/en_US/help/topic/G202101910
