name: Tangent Templates
url: https://templates.tangent.rocks
categories: [low-content, cover-design]
tagline: Tangent Templates is a web app for low-content publishers that builds KDP interiors and covers from 130+ templates, sold for a one-time price.
summary: >-
  Tangent Templates generates low- and medium-content interiors (journals, planners, logs, worksheets, picture and coloring book layouts) in KDP trim sizes, plus a cover designer that lays out spine and barcode area, a PDF inspector, a price calculator and a 3D mockup tool. Its Listing Helper Chrome extension fills title, keywords, description and categories into the KDP form in your own browser; the vendor says it is not upload automation, but it does act on your KDP dashboard, so check KDP's terms yourself. The old tangenttemplates.com domain is now a parked page; the product lives at templates.tangent.rocks.
