name: Krita
url: https://krita.org
categories: [cover-design]
tagline: Krita is a free, open-source digital painting app for illustrators that publishers use to paint cover art and children's book illustrations.
summary: >-
  Krita is built for drawing and painting, with brushes, layers and animation tools, and it can work in a CMYK color
  model natively. It cannot export PDF, which KDP requires for print covers and interiors, so you export TIFF or PNG and
  assemble the final PDF in another program. It has no book templates or spine calculation.
pricing: { model: free, currency: USD }
platforms: [windows, mac, linux]
kdp:
  touches_kdp_account: false
  content_types: [children, coloring, fiction]
pros:
  - Free and open source, with professional painting tools
  - Native CMYK color model for print artwork
cons:
  - No PDF export
  - Painting-focused; weak for typography and cover layout
best_for: [Painting original cover art and picture book illustrations]
alternatives: [gimp, photopea, inkscape]
status: published
verified_at: 2026-11-09
sources:
  - https://krita.org/en/
  - https://docs.krita.org/en/_sources/general_concepts/file_formats/file_pdf.rst.txt
  - https://docs.krita.org/en/_sources/general_concepts/colors/color_models.rst.txt
