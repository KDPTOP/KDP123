name: Atticus
url: https://www.atticus.io
categories: [writing-formatting]
tagline: Atticus is a cross-platform book writing and formatting app that exports print-ready PDF and EPUB, sold for a one-time price.
summary: >-
  Atticus is an all-in-one writing and formatting app with 17 templates and a custom theme builder. It is a progressive web app that runs on Windows, Mac, Linux and Chromebook, online or offline, and exports EPUB, PDF and DOCX for ebook and print. It is made by the founder of Kindlepreneur and Publisher Rocket, so reviews on that site are not independent of the vendor.
