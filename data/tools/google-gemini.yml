name: Google Gemini
url: https://gemini.google.com
categories: [ai-tools]
tagline: Google Gemini is Google's AI assistant for writing, research and image generation, with paid tiers sold as Google AI plans.
summary: >-
  Gemini can draft and edit text, run Deep Research reports, and generate or edit images with Google's Nano Banana
  models. It does not produce KDP-ready interiors or cover files. KDP's content guidelines require you to disclose
  AI-generated text, images or translations when you publish; using AI only to edit or brainstorm your own work is
  AI-assisted and does not need disclosure. Paid plans bundle Google cloud storage and other Google services, so part of
  the price is not for the AI.
pricing: { model: freemium, from: 4.99, currency: USD, period: month, free_tier: true, note: "Google AI Plus $4.99/mo, Google AI Pro $19.99/mo, Ultra from $99.99/mo (US prices). Plus only includes the Flash model." }
