name: Photopea
url: https://www.photopea.com
categories: [cover-design]
tagline: Photopea is a free browser-based image editor similar to Photoshop that opens PSD files and can export PDF for print covers.
summary: >-
  Photopea runs in the browser without an install, opens and saves PSD files, and exports PDF, so you can lay out a KDP paperback wrap on the cover calculator template and save it as the single PDF KDP asks for. Its CMYK mode is a print preview only: Photopea stores documents in sRGB, so it does not produce true CMYK files, although KDP recommends CMYK images. It does not calculate spine width or provide book templates.
pricing: { model: freemium, currency: USD, free_tier: true, note: "All editing features are free with ads. Premium removes ads and is priced in the app's Account window; team premium covers every member." }
platforms: [web]
kdp:
  touches_kdp_account: false
  content_types: [any]
pros:
  - Free, in the browser, and reads Photoshop PSD templates
  - Exports PDF directly
cons:
  - No true CMYK output; CMYK mode is a preview
  - Ads on the free version
best_for:
  - Editors opening PSD and other image formats in a browser
alternatives: [gimp, krita, canva]
status: published
