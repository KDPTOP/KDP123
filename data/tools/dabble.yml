name: Dabble
url: https://www.dabblewriter.com
categories: [writing-formatting]
tagline: Dabble is a browser-based novel writing app with plot grid, character notes, co-authoring and offline sync, sold by subscription.
summary: >-
  Dabble covers planning, drafting and revising a novel: a drag-and-drop manuscript binder, a plot grid, goals, track changes and beta-reader sharing, synced across devices with offline writing. It exports Word and text manuscripts, not formatted EPUB or print PDF, so KDP files need a separate formatter. Dabble says it does not use your writing to train AI and that any future AI features would be opt-in.
pricing: { model: subscription, from: 180, currency: USD, period: year, note: "Writer plan $15/month billed annually ($180/year); Author plan $23/month. Lifetime plans are offered. 14-day free trial, no card required; money-back guarantee.", annual_from: 15, trial_days: 14 }
