pros:
  - Generates pages and assembles the KDP interior in one place
  - Cancel anytime; you keep commercial rights to what you made on a paid plan
cons:
  - Free-tier images cannot be used commercially
  - AI-generated images must be disclosed to KDP, and niches full of AI coloring books are crowded
