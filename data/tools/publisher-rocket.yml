name: Publisher Rocket
url: https://publisherrocket.com
categories: [book-research, keywords-categories]
tagline: Publisher Rocket is a downloadable keyword, category and competition research app for Amazon book publishers, sold as a one-time purchase.
summary: >-
  Publisher Rocket covers keyword search, category search across Amazon's 19,000+ categories, a competition analyzer with rivals' sales and rankings, and an Amazon Ads keyword generator. It supports eight Amazon stores. It is research only: it does not create, upload or market books. It is made by the founder of Kindlepreneur, which also sells Atticus.
