name: StoryOrigin
url: https://storyoriginapp.com
categories: [email-tools, reviews-arc, ads-promotion]
tagline: StoryOrigin is an author marketing app for building mailing lists, arranging newsletter swaps and group promos, and managing review copies.
summary: >-
  StoryOrigin delivers reader magnets and ARC files, connects them to your email service, and lets you arrange newsletter swaps and group promos with other authors. Its review-copy tools show each reviewer's history and completion rate and send automated follow-ups; it can also distribute audiobook promo codes and build simple author sites. It is not an email sender itself, so you still need a provider such as MailerLite or Kit. Amazon lets you give free review copies only if you do not require a review or try to influence it, so treat follow-ups as reminders, not conditions.
