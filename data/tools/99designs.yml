name: 99designs
url: https://99designs.com
categories: [cover-design]
tagline: 99designs is a design marketplace owned by Vista where authors run a book cover contest or hire one designer directly.
summary: >-
  In a contest you post a brief, designers from around the world submit concepts (about 30 at the lowest package), and you pick and refine a winner, receiving the copyright and production files. You can also request quotes from a single designer. It is a general design marketplace, not book-specific, so quality varies between designers and you need to give them KDP's trim, bleed and spine specs yourself.
pricing: { model: paid, from: 299, currency: USD, period: one-time, note: "Book cover contest packages: Bronze $299, Silver $499, Gold $799, Platinum $1,199, excluding sales tax. 1-to-1 projects are estimated at $279 to $999.", region_note: Contest package prices exclude sales tax. }
platforms: [web]
kdp:
  touches_kdp_account: false
  content_types: [any]
pros:
  - Many concepts to choose from in one contest
  - Money-back guarantee on most contests before the final round
cons:
  - Designers are not KDP specialists; you supply the print specs
  - Contest pricing is high for a single ebook cover
best_for:
  - Authors running a custom book cover design contest
  - Authors hiring a freelancer for typesetting and interiors
alternatives: [fiverr, reedsy-marketplace, damonza]
