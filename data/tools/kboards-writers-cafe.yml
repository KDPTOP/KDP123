tagline: The KBoards Writers' Cafe is a long-running forum for Kindle self-publishers, now quieter but still open, with an archive of early KDP discussion.
summary: >-
  The Writers' Cafe on KBoards, originally KindleBoards, was a central forum for indie authors in the early Kindle
  years and still takes new posts in 2026, though activity is much lower than at its peak. The site is owned by
  VerticalScope, a forum network, and sells banner ads and book promotion slots. Its rules ban self-promotion inside
  posts; authors may promote in their signature and keep one thread per book in the Book Bazaar section.
pricing: { model: free, currency: USD, note: "Free to join; paid ads and book promotions are sold separately." }
