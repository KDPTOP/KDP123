name: Plottr
url: https://plottr.com
categories: [writing-formatting]
tagline: Plottr is a visual outlining app for novelists and series writers that maps plot lines, scenes and characters on a timeline, with no AI features.
summary: >-
  Plottr lays out a book or series as a timeline of scenes across plot lines, with templates for common story structures and a series bible for characters and places. It is for planning only: it does not write, edit or format books, so it produces nothing you upload to KDP. Every plan is advertised as having no AI features.
