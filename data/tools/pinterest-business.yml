name: Pinterest Business
url: https://business.pinterest.com
categories: [ads-promotion]
tagline: Pinterest Business is Pinterest's free business account and ads platform for promoting Pins to people searching and browsing ideas.
summary: >-
  A free Pinterest business account adds analytics and lets authors pin book covers, quotes or printables that link to a
  book page or signup page, and run auction-priced ads. It suits visual niches such as cookbooks, coloring, journals,
  crafts and children's books more than most fiction. Ads are not available in every country, and like other off-Amazon
  ads, sales on Amazon from Pinterest clicks are hard to attribute.
pricing:
  model: freemium
  currency: USD
  free_tier: true
  note: "Business account is free. Ads use an auction with bid floors that vary by campaign type and country (e.g. a $0.10 CPC floor for the US in Pinterest's example); you set the budget."
platforms: [web, ios, android]
kdp:
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [low-content, coloring, children, nonfiction]
pros:
  - Free organic pinning and Pin analytics with a business account
  - In the ad auction you pay only what beats the next ad, often less than your bid
cons:
  - New business accounts can only be created on desktop
  - Ads are unavailable in some countries
best_for: [Promoting visual nonfiction and low-content books with pins]
alternatives: [meta-ads-manager, amazon-ads]
status: published
verified_at: 2026-11-09
sources:
  - https://help.pinterest.com/en/business/article/get-a-business-account
  - https://help.pinterest.com/en/business/article/set-your-bid
  - https://business.pinterest.com/
