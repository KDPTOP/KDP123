name: Author's Republic
url: https://www.authorsrepublic.com
categories: [audio]
tagline: Author's Republic is a free, non-exclusive audiobook distributor for indie authors that sends finished audiobooks to retail, library and streaming channels for 20% of royalties.
summary: >-
  Author's Republic distributes audiobooks to Audible, Apple, Spotify, Google Play, library platforms such as Hoopla and Libby, and music streaming services; it is free to use, pays 80% of earned royalties, and offers narrator hiring. You can opt out of Amazon/Audible if you already sell there through ACX non-exclusively, but an ACX title under an exclusive agreement (required to enroll an ACX audiobook in KDP Select) cannot go wide. It is testing distribution of AI-narrated audiobooks, which not all retailers accept.
pricing: { model: free, currency: USD, note: "Free to use. Authors receive 80% of earned royalties. Production services are priced separately." }
platforms: [web]
kdp:
  touches_kdp_account: false
  content_types: [any]
pros:
  - Free and non-exclusive, with retailer groups you can opt out of
  - Reaches library and music-streaming channels as well as retail
cons:
  - Takes 20% of royalties on every channel
  - Delivering the same audiobook to a store through two distributors breaks its terms
best_for:
  - Authors producing and distributing audiobooks to Audible, Apple, and Spotify
alternatives: [spotify-for-authors, streetlib, publishdrive]
