name: KDP Select
url: https://kdp.amazon.com/en_US/help/topic/G200798990
categories: [official]
tagline: KDP Select is Amazon's free 90-day opt-in program for Kindle eBooks and audiobooks that puts them in Kindle+, formerly Kindle Unlimited, in exchange for eBook exclusivity.
summary: >-
  Enrolling an eBook in KDP Select adds it to Kindle+ (the subscription Amazon renamed from Kindle Unlimited), where reads are paid from the KDP Select Global Fund, and unlocks Free Book Promotions and Kindle Countdown Deals. The catch is exclusivity: for each 90-day term the eBook can only be distributed through KDP and public libraries, though print and other formats can be sold elsewhere. Enrollment renews automatically unless you turn renewal off, and you can only cancel within three days of the start of a term.
official: true
pricing: { model: free, currency: USD, note: "Free to enroll; the cost is eBook exclusivity to Amazon for each 90-day term." }
platforms: [web]
kdp:
  outputs_kdp_files: false
  content_types: [any]
pros:
  - Kindle+ page-read royalties on top of sales
  - Access to Free Book Promotions and Kindle Countdown Deals
cons:
  - The eBook cannot be sold on other stores while enrolled
  - Auto-renews every 90 days unless you switch renewal off
  - Kindle Countdown Deals run only on Amazon.com and Amazon.co.uk
best_for:
  - Authors enrolling Kindle ebooks in a free 90-day KDP Select term for Kindle+
alternatives: [draft2digital]
