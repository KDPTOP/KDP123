name: Canva
url: https://www.canva.com
categories: [cover-design, low-content]
tagline: Canva is a template-based design tool widely used for KDP ebook covers, simple low-content interiors and marketing graphics.
summary: >-
  Canva has a large template library and a free plan that is enough for many low-content interiors and ebook covers.
  For print books it does not calculate KDP spine width for you, and you must set bleed, trim size and safe zones
  yourself. Pro costs US$18 a month or US$144 a year in the US, and Canva shows regional prices in other countries.
