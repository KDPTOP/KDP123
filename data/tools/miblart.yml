name: MiblArt
url: https://miblart.com
categories: [cover-design]
tagline: MiblArt is a book cover design studio for indie authors that offers custom ebook and print covers with payment after you approve the design.
summary: >-
  MiblArt designs custom ebook and print covers, illustrated covers, special-edition extras such as sprayed edges, and
  author branding. For stock-photo covers it takes no prepayment, sends a first concept within 5 business days, and
  allows unlimited revisions, according to its site. Prices start where its packages show them, and the result depends
  on the designer assigned. Budget brand GetCovers says it belongs to the same Miblgroup family.
