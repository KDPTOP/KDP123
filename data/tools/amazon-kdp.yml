tagline: Amazon Kindle Direct Publishing is Amazon's free self-publishing platform for Kindle ebooks and print paperbacks and hardcovers.
summary: >-
  KDP is the platform most listings in this directory exist to serve. It is free to use, lets you publish ebooks and print
  books, offers the optional KDP Select program for Kindle+ (formerly Kindle Unlimited), and publishes the official rules on content, AI
  disclosure, royalties and printing. When another site contradicts KDP's help pages, the help pages win.
