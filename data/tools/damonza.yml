tagline: Damonza is a New Zealand book design studio for self-publishers that sells custom covers, interior formatting and full launch packages.
summary: >-
  Damonza designs print, ebook and audiobook covers and also formats interiors and makes promotional graphics, either
  built to order or as an all-in-one package. It says it has completed over 14,000 projects since 2012, delivers first
  drafts within 14 days and offers a deposit-back guarantee if it cannot get the design right. It is a premium-priced
  service; prices start at what its site lists, and results still depend on your brief and the designer.
