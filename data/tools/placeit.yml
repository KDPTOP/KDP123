name: Placeit
url: https://placeit.net
categories: [cover-design]
tagline: Placeit is an Envato-owned browser mockup and template site for sellers and authors that makes book mockups and simple book cover designs.
summary: >-
  Placeit has a large library of paperback, hardcover and Kindle device mockups plus editable book cover templates, all run in the browser. Downloads are PNG images (MP4 for video), so it does not produce the single PDF print wrap with spine that KDP requires for paperbacks; you assemble that elsewhere. It is a general marketing-asset site for many kinds of sellers, not a KDP-specific tool, and template quality varies.
pricing: { model: subscription, from: 7.47, currency: USD, period: month, note: "The headline $7.47/mo is the annual plan ($89.69 billed yearly); third-party reviews list the monthly plan at $14.95. One-month minimum once you download anything.", annual_from: 7.47 }
