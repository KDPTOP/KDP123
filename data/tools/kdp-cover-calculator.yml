name: KDP Cover Calculator
url: https://kdp.amazon.com/en_US/cover-calculator
categories: [official, cover-design]
tagline: The KDP Cover Calculator is Amazon's free web tool for paperback and hardcover publishers that gives exact full-cover dimensions and a downloadable template.
summary: >-
  The KDP Cover Calculator works out the full wrap dimensions of a print cover, including the spine, from your trim size,
  page count and print options, and lets you download a PDF and PNG template to use as a guide layer in your design
  software. It covers paperback and hardcover only; eBook covers do not need it. It does not design the cover for you,
  and the template is a guide, not a finished file.
official: true
pricing: { model: free, currency: USD }
platforms: [web]
kdp:
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [any]
pros:
  - Free, no sign-in needed, and the numbers come from KDP itself
  - Template downloads as both PDF and PNG
cons:
  - Spine width changes with page count, so the template must be regenerated if the interior changes
  - Gives dimensions only; the artwork is up to you
best_for: [Getting exact spine and full-wrap dimensions before designing a print cover]
alternatives: [canva]
status: published
verified_at: 2026-11-09
sources:
  - https://kdp.amazon.com/en_US/cover-calculator
  - https://kdp.amazon.com/en_US/help/topic/G201953020
