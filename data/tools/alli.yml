name: Alliance of Independent Authors (ALLi)
url: https://www.allianceindependentauthors.org
categories: [communities, courses-blogs]
tagline: ALLi is a nonprofit membership association for self-publishing authors that offers a member forum, contract advice and public watchdog ratings of author services.
summary: >-
  The Alliance of Independent Authors, founded by Orna Ross in 2012 and based in London, offers a private member forum, contract vetting, discounts and the free Self-Publishing Advice blog and podcast. Its Watchdog Desk, led by John Doppler, publishes free ratings of self-publishing services, which is useful for checking a vendor before you pay. Partner members are paying service companies that are vetted and appear as "Excellent (Partner)" in those ratings, so ratings and partner listings are not fully independent of ALLi's income.
