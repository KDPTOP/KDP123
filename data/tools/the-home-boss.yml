tagline: The Home Boss is a self-publishing training brand by Nuria Corbi for KDP publishers that offers a monthly academy, paid courses and free resources.
summary: >-
  The Home Boss covers the KDP process from niche research to publishing and growing a catalog, with a focus on low-content, puzzle and activity books, children's books and branding. The Academy membership adds tools, templates, weekly live calls and a community; standalone courses on Podia are taught mainly in Canva. It is teaching only: it does not publish or upload books for you. Standalone courses have no refunds.
