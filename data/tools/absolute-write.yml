tagline: Absolute Write Water Cooler is a free, moderated writers' forum known for its Bewares board, where members report on publishers, agents and services.
summary: >-
  Absolute Write, founded in 1998, is a free forum for writers, editors and agents with boards on craft, publishing and
  a large Bewares, Recommendations and Background Check section that is useful for vetting a service before you pay.
  It is still active in late 2026, but it leans toward traditional publishing, and writers report that new account
  approvals have stalled since 2025. It has a zero-tolerance rule against AI-generated or AI-assisted content,
  including posts and avatars, with bans for breaking it.
