name: GetCovers
url: https://getcovers.com
categories: [cover-design]
tagline: GetCovers is a low-cost book cover design service for indie authors that sells fixed-price ebook and print-ready cover packages.
summary: >-
  GetCovers designs ebook covers and full print wraps with back and spine, delivered in about 3 to 4 days with unlimited
  revisions and a money-back guarantee, according to its site. Work is done by in-house, mostly junior designers in
  Ukraine using licensed stock images, so expect template-style stock compositions rather than custom illustration, and
  quality varies by designer. It says it is part of the Miblgroup family of brands and links to MiblArt, a pricier
  studio.
pricing: { model: paid, from: 10, currency: USD, period: one-time, note: "Packages shown at check time: $10 ebook cover, $20 ebook plus print-ready cover, $35 premium. Its FAQ says the average order is $25 to $35; add-ons and faster delivery cost extra." }
