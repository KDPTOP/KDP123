tagline: Reedsy Studio is a free browser-based writing and formatting tool that exports EPUB and print-ready PDF, with real-time collaboration.
summary: >-
  Reedsy Studio is a browser-based editor with track changes, real-time collaboration and export to EPUB and print-ready PDF. The core editor is free for unlimited books and devices. Paid add-ons add features on top: Craft ($4.99 a month) for unlimited history, advanced stats and goals, and Outlining ($7.99 a month) for unlimited boards and notes. It sits alongside Reedsy's marketplace of freelance editors and designers.
