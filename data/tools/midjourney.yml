name: Midjourney
url: https://www.midjourney.com
categories: [ai-tools, cover-design]
tagline: Midjourney is a paid AI image generator that many publishers use for cover art and coloring page concepts, but it outputs images only.
summary: >-
  Midjourney produces high-quality illustrated and photorealistic imagery, which makes it a common choice for cover art.
  It does not do layout, spine calculation or KDP-compliant PDFs, so you need a second tool for the final files. Plans
  start from about $10 a month. Check KDP's current AI-generated content disclosure rules before publishing.
