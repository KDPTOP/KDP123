name: Ereader News Today
url: https://www.ereadernewstoday.com
categories: [ads-promotion]
tagline: Ereader News Today is an ebook deal newsletter and website for authors that promotes free and discounted books for a per-genre fee.
summary: >-
  Ereader News Today (ENT) features accepted free or discounted ebooks on its website, social accounts and daily newsletter. The discount must be live on Amazon.com by 6 a.m. Eastern on the promo day; other retailers are optional. Books need at least 125 pages (except children's, nonfiction and cookbooks), cannot have run with ENT in the past 90 days, and erotica is not accepted. Its terms are strict: no refunds except for ENT's own errors, and authors who raise the price early or do not pay are barred from future promotions.
pricing:
  model: paid
  from: 40
  currency: USD
  period: one-time
  note: "Per-genre prices on its submission page rise with the deal price: from $40 (e.g. Fantasy, Horror, Sci-Fi at free or $0.99) to $140 (Romance or Historical Romance at $2.99). Payment is due once a date is confirmed."
platforms: [web]
kdp:
  marketplaces: [us]
  outputs_kdp_files: false
  touches_kdp_account: false
  content_types: [fiction, nonfiction, children]
pros:
  - Full price grid by genre and deal price is public
  - Works with KDP Select Kindle Countdown Deals and free days
cons:
  - Requires an Amazon.com discount; no refunds if your price is not changed in time
  - Not every submission is accepted, and you must submit at least 2 weeks ahead
best_for:
  - Readers getting daily free and bargain ebook deal emails by genre
alternatives: [bookbub, written-word-media, robin-reads, the-fussy-librarian]
status: published
verified_at: 2026-11-09
sources:
  - https://www.ereadernewstoday.com/bargain-and-free-book-submissions/
features_checked_at: 2026-11-10
