name: Jutoh
url: https://www.jutoh.com
categories: [writing-formatting]
tagline: Jutoh is a desktop ebook editor for Windows, Mac and Linux that imports Word files and compiles EPUB and Kindle-ready books, sold for a one-time price.
summary: >-
  Jutoh imports Word, ODT, EPUB or text files, splits them into chapters, and compiles reflowable or fixed-layout EPUB that you check in Kindle Previewer before uploading to KDP. For paperbacks it exports ODT that you convert to PDF in LibreOffice or OpenOffice, with a print-on-demand wizard for page styles, so print needs a second program. It is made by Anthemion Software, a small UK company.
