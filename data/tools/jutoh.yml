pros:
  - Runs on Linux as well as Windows and Mac
  - Built-in EPUB checker and accessibility advisories
cons:
  - Print PDF goes through ODT and LibreOffice/OpenOffice, not a direct export
  - Interface is dated next to Vellum or Atticus
best_for:
