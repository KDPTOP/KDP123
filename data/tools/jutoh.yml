name: Jutoh
url: https://www.jutoh.com
categories: [writing-formatting]
tagline: Jutoh is a desktop ebook editor for Windows, Mac and Linux that imports Word files and compiles EPUB and Kindle-ready books, sold for a one-time price.
summary: >-
  Jutoh imports Word, ODT, EPUB or text files, splits them into chapters, and compiles reflowable or fixed-layout EPUB
  that you check in Kindle Previewer before uploading to KDP. For paperbacks it exports ODT that you convert to PDF in
  LibreOffice or OpenOffice, with a print-on-demand wizard for page styles, so print needs a second program. It is made
  by Anthemion Software, a small UK company.
pricing: { model: one-time, from: 45, currency: USD, period: one-time, refund_days: 30, note: "Standard Edition $45 excl. VAT; Plus Edition $90. A free demo is available. 25% discount for ALLi and IAPP members." }
platforms: [windows, mac, linux]
kdp:
  outputs_kdp_files: true
  touches_kdp_account: false
  content_types: [fiction, nonfiction, children]
pros:
  - Runs on Linux as well as Windows and Mac
  - Built-in EPUB checker and accessibility advisories
cons:
  - Print PDF goes through ODT and LibreOffice/OpenOffice, not a direct export
  - Interface is dated next to Vellum or Atticus
best_for: [Producing EPUB ebooks from Word manuscripts on any desktop OS]
alternatives: [atticus, vellum, sigil, calibre]
