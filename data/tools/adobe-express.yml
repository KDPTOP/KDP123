name: Adobe Express
url: https://www.adobe.com/express/
categories: [cover-design]
tagline: Adobe Express is Adobe's template-based online design app for quick graphics that KDP publishers use for ebook covers, ads and social images.
summary: >-
  Adobe Express offers templates, Adobe Stock assets, Adobe Fonts and Firefly generative AI in a browser and mobile app.
  Premium Adobe Stock assets inside Express carry the "Limited License – Adobe Express": you may not put them into
  merchandise or template files for sale unless the final work is an original work of authorship, you cannot export
  them as stand-alone files, and you cannot use them in new projects after your paid membership ends. It is a general
  design tool, so you size print covers yourself from KDP's cover calculator. Images generated with Firefly count as
  AI-generated content that KDP requires you to disclose.
pricing: { model: freemium, from: 9.99, currency: USD, period: month, free_tier: true, note: "Premium is US$9.99/month on Adobe's plans page; also included with most Creative Cloud plans." }
