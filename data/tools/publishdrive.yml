name: PublishDrive
url: https://publishdrive.com
categories: [print-distribution, audio]
tagline: PublishDrive is a subscription ebook, print and audiobook distributor for self-publishers that sends one upload to 50+ stores and takes no royalty commission.
summary: >-
  PublishDrive distributes ebooks, print-on-demand books and audiobooks to stores and library networks from one dashboard,
  and charges a flat subscription instead of a cut of sales (0% revenue share on its plans). The free plan covers one
  ebook to Apple Books, Barnes & Noble and Kobo only. Distributing an ebook through it conflicts with KDP Select, which
  requires the enrolled ebook to be exclusive to Amazon; print and audio editions are not covered. It can also deliver to
  Amazon, so a publisher already on KDP should leave that channel off to avoid duplicate listings.
pricing: { model: freemium, from: 16.99, currency: USD, period: month, free_tier: true, refund_days: 30, note: "Starter is $16.99/month billed monthly or $13.99/month billed annually, for 3 titles. Free plan: 1 ebook to 3 stores. Paid plans keep 100% of royalties." }
platforms: [web]
kdp:
