  content_types: [any]
pros:
  - No percentage taken from royalties on any plan
  - One upload covers ebook, print and audiobook distribution
cons:
  - Monthly fee is charged whether or not the books sell
  - Free plan reaches only three stores
best_for: [Publishers with steady sales across several stores who prefer a flat fee to a commission]
