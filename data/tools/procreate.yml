name: Procreate
url: https://procreate.com
categories: [cover-design, low-content]
tagline: Procreate is an iPad drawing and painting app for illustrators that KDP publishers use to draw coloring pages, cover art and picture book illustrations.
summary: >-
  Procreate is a raster illustration app for iPad and Apple Pencil, sold as a one-time purchase. KDP publishers use it to draw original line art for coloring books and art for covers and children's books, then lay the pages out in another app; it does not assemble book interiors or calculate spine width. Procreate has publicly committed to no generative AI in its apps, so artwork drawn in it is your own and does not need an AI disclosure to KDP.
