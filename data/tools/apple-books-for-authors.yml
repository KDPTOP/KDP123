name: Apple Books for Authors
url: https://authors.apple.com
categories: [print-distribution]
tagline: Apple Books for Authors is Apple's free portal for self-publishers that puts EPUB ebooks on Apple Books through an iTunes Connect account.
summary: >-
  Apple Books for Authors is Apple's guide and web publishing portal for selling ebooks on Apple Books directly; files must pass EPUBCheck, and an ISBN is optional. Sign-up is free, and Apple states 70% royalties on every ebook regardless of price with no file delivery fees (its homepage comparison with KDP is Apple's own claim). Selling the same ebook on Apple Books conflicts with KDP Select ebook exclusivity.
pricing: { model: free, currency: USD, note: "Free iTunes Connect account. Apple states 70% royalties on every ebook regardless of price." }
platforms: [web]
kdp:
  touches_kdp_account: false
  content_types: [any]
pros:
  - Flat 70% royalty with no price band
  - Free books can be listed without restriction
cons:
  - Ebooks only; print is not offered
  - Requires an Apple Account and an EPUB that passes EPUBCheck
best_for:
  - Authors self-publishing ebooks on Apple Books, including digital-narration audiobooks
alternatives: [kobo-writing-life, google-play-books-partner, draft2digital]
status: published
verified_at: 2026-11-09
