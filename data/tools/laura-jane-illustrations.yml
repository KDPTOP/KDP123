tagline: Laura Jane Illustrations is an illustrator's site for artists that sells Published & Printed, a self-paced course on making low-content and creative books for KDP.
summary: >-
  Laura Jane Jones is a freelance illustrator who sells her own planners, calendars and art, and runs a YouTube channel
  and Patreon. Her KDP course, Published & Printed, has six modules covering KDP setup, interior layout in InDesign or
  Canva, covers from KDP's cover template in Canva, Procreate or Illustrator, listings, A+ Content and organic launch
  marketing, with feedback on your files. It suits artists making creative journals and coloring books rather than
  publishers looking for volume or niche-research systems.
