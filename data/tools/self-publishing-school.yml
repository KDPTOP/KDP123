name: Self-Publishing School
url: https://self-publishingschool.com
categories: [courses-blogs]
tagline: Self-Publishing School is a paid coaching program for first-time authors that pairs one-to-one coaching with done-for-you formatting, covers and publishing.
summary: >-
  Self-Publishing School is Chandler Bolt's coaching business, now run under the selfpublishing.com brand, where its
  program pages and prices live. Programs bundle a year of coaching, a video course, a community and done-for-you
  formatting, cover design, ISBN and publishing to Amazon; enrollment goes through a sales call. It is aimed at
  first-time nonfiction, fiction, memoir and children's authors, not at low-content or volume KDP publishers. The same
  company owns The Book Designer and The Write Life, so reviews on those sites are not independent of it.
