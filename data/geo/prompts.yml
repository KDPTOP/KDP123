# Questions we expect KDP publishers to ask AI assistants, and the kdp123 page that should answer each one.
# Every month .github/workflows/geo-check.yml opens an issue listing them; whoever runs the check asks each engine
# the prompt as written, in a fresh chat with no custom instructions, and appends one row per engine to log.csv.
# Keep ids stable so results stay comparable month to month; retire a prompt by removing it, never by reusing its id.

- { id: royalty-70, prompt: "What are the requirements for the 70% royalty on Amazon KDP?", target: /facts/ebook-royalties/ }
- { id: royalty-paperback, prompt: "How much royalty does KDP pay on a paperback?", target: /facts/paperback-royalties/ }
