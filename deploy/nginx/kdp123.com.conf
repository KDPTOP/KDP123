# Host nginx site for kdp123.com: a static Astro build served from /opt/kdp123/current (a symlink that
# deploy/deploy.sh switches atomically). DNS is proxied by Cloudflare (SSL mode Full strict).
# Certificate: certbot certonly --webroot -w /opt/kdp123/acme -d kdp123.com -d www.kdp123.com
#   --deploy-hook "systemctl reload nginx"

# Only Cloudflare may reach the site: a direct hit on the origin would skip the edge's WAF and bot rules.
# $realip_remote_addr is the peer before the real-IP rewrite. Ranges: https://www.cloudflare.com/ips
geo $realip_remote_addr $kdp123_via_edge {
    default 0;
    127.0.0.1/32 1;
    ::1/128 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Per-path headers as variables: an add_header inside a location would drop every server-level one (HSTS included).
# An empty value means the header is not sent.
map $uri $kdp123_cors {
    default "";
    ~^/tools\.(json|csv)$ "*";
}
map $uri $kdp123_robots {
    default "";
    ~^/go/ "noindex, nofollow";
}

# Site search beacons (/s?q=&n=): what people looked for and how many results they got. No IP is kept.
log_format kdp123search escape=json '{"t":"$time_iso8601","c":"$http_cf_ipcountry","q":"$arg_q","n":"$arg_n"}';

# The free category finder proxies KDPTop's public endpoints, which allow guests a few lookups a day per IP.
limit_req_zone $binary_remote_addr zone=kdp123_kdptop:1m rate=20r/m;

log_format kdp123 escape=json
    '{"t":"$time_iso8601","ip":"$remote_addr","c":"$http_cf_ipcountry","m":"$request_method",'
    '"u":"$request_uri","s":$status,"ua":"$http_user_agent","r":"$http_referer","aop":"$ssl_client_verify"}';

server {
    listen 80;
    listen [::]:80;
    server_name kdp123.com www.kdp123.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/kdp123/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://kdp123.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kdp123.com www.kdp123.com;

    ssl_certificate /etc/letsencrypt/live/kdp123.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kdp123.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Authenticated Origin Pulls (enabled on the zone): only Cloudflare holds a client certificate this CA signed.
    # CA: https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
    ssl_client_certificate /opt/kdp123/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    access_log /var/log/nginx/kdp123.access.log kdp123;
    error_log /var/log/nginx/kdp123.error.log;

    if ($kdp123_via_edge = 0) {
        return 444;
    }

    if ($host = www.kdp123.com) {
        return 301 https://kdp123.com$request_uri;
    }

    root /opt/kdp123/current;
    index index.html;
    charset utf-8;
    charset_types text/plain text/markdown text/csv text/xml application/json;
    absolute_redirect off;
    error_page 404 /404.html;

    # Staged HSTS (plan: 300s, then a week, six months, a year); no includeSubDomains or preload yet.
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    add_header Access-Control-Allow-Origin $kdp123_cors always;
    add_header X-Robots-Tag $kdp123_robots always;

    # Cloudflare's Always Use HTTPS can send renewal challenges here instead of to port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /opt/kdp123/acme;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
        expires 10m;
    }

    location ~ ^/(favicon\.ico|favicon-\d+\.png|apple-touch-icon\.png|icon-[\w-]+\.png)$ {
        expires 7d;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        types { }
        expires 7d;
    }

    location ^~ /og/ {
        expires 1d;
    }

    location ^~ /logos/ {
        expires 7d;
    }

    # Hashed build assets never change under the same name.
    location ^~ /_astro/ {
        expires 1y;
    }

    location ~ \.md$ {
        default_type text/markdown;
        types { }
        expires 10m;
    }

    location ~ ^/(llms|llms-full)\.txt$ {
        expires 1h;
    }

    location = /tools.json {
        expires 1h;
    }

    location = /tools.csv {
        default_type text/csv;
        types { }
        expires 1h;
    }

    location = /s {
        access_log /var/log/nginx/kdp123.search.log kdp123search;
        expires epoch;
        return 204;
    }

    # Same quotas as on kdptop.com: KDPTop counts uses by X-Real-IP, which here is the visitor (real-IP snippet).
    # Only the two guest endpoints pass; cookies and credentials never do.
    location ~ ^/api/kdptop/placement/(resolve|recommend)$ {
        limit_except GET POST { deny all; }
        limit_req zone=kdp123_kdptop burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:18600/api/public/placement/$1$is_args$args;
        proxy_set_header Host kdptop.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        expires epoch;
    }

    # Read-only KDPTop data for the free tools and the home page (data/providers/kdptop.yml). GET only.
    location ~ "^/api/kdptop/(today|bsr-curve|category/\d{1,15}|keywords/suggest)$" {
        limit_except GET { deny all; }
        limit_req zone=kdp123_kdptop burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18600/api/public/$1$is_args$args;
        proxy_set_header Host kdptop.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ /\. {
        return 404;
    }
}
