name: Monthly report

# On the 1st, freeze last month's report and open a draft PR. Review the numbers, mark it ready, merge, then deploy.
on:
  schedule:
    - cron: '20 6 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Month to (re)build, YYYY-MM. Empty = last month.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Freeze the report
        id: gen
        run: |
          node scripts/monthly-report.mjs ${{ inputs.month }} | tee summary.txt
          echo "month=$(sed -E 's#^data/reports/([0-9-]+)\.json.*#\1#' summary.txt)" >> "$GITHUB_OUTPUT"
      - name: Build to validate
        run: npm run build
      - name: Open or update the draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.gen.outputs.month }}
        run: |
          branch="report/$MONTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add "data/reports/$MONTH.json"
          if git diff --cached --quiet; then echo "No changes for $MONTH"; exit 0; fi
          git commit -m "Monthly report: $MONTH"
          git push -f origin "$branch"
          {
            echo "Generated by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo '```'; cat summary.txt; echo '```'
            echo
            echo "Before merging: check the top categories against KDPTop, read every price-change note, and confirm no listing is missing."
            echo "After merging: run deploy/deploy.sh. The page is /reports/$MONTH/."
          } > body.md
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --body-file body.md
          else
            gh pr create --draft --base main --head "$branch" --title "Monthly report: $MONTH" --body-file body.md
          fi
